name: Build APK (debug)

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Extrair e localizar projeto Android
        shell: bash
        run: |
          set -euo pipefail

          if [ -f project-modificado.zip ]; then
            mkdir -p src_proj
            unzip -oq project-modificado.zip -d src_proj
            ROOT="src_proj"
          elif [ -f project.zip ]; then
            mkdir -p src_proj
            unzip -oq project.zip -d src_proj
            ROOT="src_proj"
          else
            ROOT="."
          fi

          echo "Procurando arquivos Gradle..."

          SETTINGS=$(find "$ROOT" \
            -type f \
            \( -name settings.gradle -o -name settings.gradle.kts \) \
            -not -path '*/.gradle/*' \
            -print -quit)

          if [ -z "$SETTINGS" ]; then
            echo "::error::Não encontrei settings.gradle nem settings.gradle.kts."
            echo "Arquivos disponíveis:"
            find "$ROOT" -maxdepth 5 -type f \
              -not -path '*/.gradle/*' | head -n 150
            exit 1
          fi

          SRC="$(dirname "$SETTINGS")"

          echo "SRC=$SRC" >> "$GITHUB_ENV"
          echo "Projeto encontrado em: $SRC"
          ls -la "$SRC"

          if [ ! -f "$SRC/gradlew" ] &&
             [ ! -f "$SRC/build.gradle" ] &&
             [ ! -f "$SRC/build.gradle.kts" ]; then
            echo "::error::A pasta encontrada não parece ser a raiz completa do projeto Gradle."
            exit 1
          fi

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      - name: Compilar APK de depuração
        shell: bash
        run: |
          set -euo pipefail
          cd "$SRC"

          if [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew assembleDebug --no-daemon --stacktrace
          else
            gradle assembleDebug --no-daemon --stacktrace
          fi

      - name: Localizar e preparar APK
        shell: bash
        run: |
          set -euo pipefail

          APK=$(find "$SRC" \
            -type f \
            -path '*/build/outputs/apk/debug/*.apk' \
            -print -quit)

          if [ -z "$APK" ]; then
            echo "::error::A compilação não gerou um APK de depuração."
            exit 1
          fi

          cp "$APK" ios-banners-debug.apk
          ls -lh ios-banners-debug.apk

      - name: Disponibilizar APK para download
        uses: actions/upload-artifact@v4
        with:
          name: ios-banners-debug-apk
          path: ios-banners-debug.apk
          if-no-files-found: error

      - name: Publicar APK em Releases
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create "debug-${{ github.run_number }}" \
            ios-banners-debug.apk \
            --title "APK de depuração #${{ github.run_number }}" \
            --notes "APK de depuração compilado pelo GitHub Actions. Não testado em aparelho." \
            --latest
