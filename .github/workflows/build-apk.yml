name: Build APK (debug)

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Localizar e extrair o projeto
        shell: bash
        run: |
          set -e

          if [ -f project.zip ]; then
            mkdir -p src_proj
            unzip -oq project.zip -d src_proj
            ROOT="src_proj"
          else
            ROOT="."
          fi

          SETTINGS=$(find "$ROOT" -type f \
            \( -name settings.gradle -o -name settings.gradle.kts \) \
            -not -path '*/.gradle/*' | head -n 1)

          if [ -z "$SETTINGS" ]; then
            echo "ERRO: não encontrei settings.gradle nem settings.gradle.kts."
            echo "Arquivos encontrados:"
            find "$ROOT" -maxdepth 4 -type f | head -n 100
            exit 1
          fi

          SRC=$(dirname "$SETTINGS")
          echo "SRC=$SRC" >> "$GITHUB_ENV"

          echo "Projeto encontrado em: $SRC"
          ls -la "$SRC"

          if [ ! -f "$SRC/build.gradle" ] &&
             [ ! -f "$SRC/build.gradle.kts" ]; then
            echo "AVISO: build.gradle não encontrado na raiz do projeto."
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      - name: Compilar
        shell: bash
        run: |
          set -e
          cd "$SRC"
          gradle assembleDebug --no-daemon --stacktrace

      - name: Localizar APK
        shell: bash
        run: |
          set -e
          APK=$(find "$SRC" -type f \
            -path '*/build/outputs/apk/debug/*.apk' | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERRO: a compilação terminou sem gerar um APK de depuração."
            exit 1
          fi

          cp "$APK" ios-banners-debug.apk
          ls -lh ios-banners-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: ios-banners-debug-apk
          path: ios-banners-debug.apk

      - name: Publicar em Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "debug-${{ github.run_number }}" \
            ios-banners-debug.apk \
            --title "APK de depuração #${{ github.run_number }}" \
            --notes "APK de depuração. Compilado na nuvem; não testado em aparelho." \
            --latest
